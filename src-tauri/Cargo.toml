[package]
name = "syncshot"
version = "0.2.16"
description = "SyncShot — fast screenshot capture, edit, and share"
authors = ["kartik labhshetwar"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The lib name matches the package name to allow `syncshot::run()` usage
# On Windows, if there's a conflict with bin name, we can add `_lib` suffix
name = "syncshot"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
dirs = "5"
image = "0.24"
# Server-side HTTP for the multi-device RECEIVE path: download Firebase Storage
# bytes from a getDownloadURL token URL in Rust, sidestepping the webview's CORS
# (getBytes()/XHR is blocked by the bucket without CORS config). native-tls uses
# macOS Security.framework, so no openssl/system-lib build deps.
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["macos-private-api", "protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-drag = "2.1.1"
tauri-plugin-global-shortcut = "2"
tauri-plugin-localhost = "2.3.2"
tauri-plugin-opener = "2"
tauri-plugin-screenshots = "2"
tauri-plugin-store = "2"
urlencoding = "2"
xcap = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
# Tauri 2.9's macOS Monitor.workArea currently preserves visibleFrame's size
# but drops its vertical origin. Read NSScreen.visibleFrame directly so the
# collapsed pill and expanded rail share the exact same usable-screen centre.
objc2-modern = { package = "objc2", version = "0.6" }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSScreen"] }

# Desktop-only: prevents a second app instance (autostart + manual launch) from
# registering a duplicate global shortcut and spawning a second column window.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
