name: Verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml
  web-and-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir syncshot-landing install --frozen-lockfile
      - run: pnpm --dir syncshot-landing build
      - run: npm ci --prefix firebase/functions
      - run: npm --prefix firebase/functions run build
      - run: node --test firebase/functions/access.test.cjs
      - run: npx --yes firebase-tools@15.23.0 emulators:exec --project demo-syncshot --config emulators.test.json --only firestore,storage 'node --test rules.test.mjs'
        working-directory: firebase
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug testDebugUnitTest
        working-directory: android
