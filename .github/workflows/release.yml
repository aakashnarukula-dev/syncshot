name: Release

# Builds the same assets the September 2026 previews were published with by hand:
#   SyncShot-macOS-<version>-Apple-Silicon.zip  (ad-hoc signed .app, arm64 only)
#   SyncShot-Android-<versionName>.apk          (release-signed)
#   SHA256SUMS.txt
#
# `v*` tags publish a normal release; `preview-*` tags publish a prerelease.
#
# Android signing needs these repository secrets (the release key is never committed):
#   ANDROID_KEYSTORE_BASE64   base64 of the release .jks
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD

on:
  push:
    tags:
      - 'v*'
      - 'preview-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release'
        required: true

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Check version strings are in sync
        run: |
          PKG=$(node -p "require('./package.json').version")
          CONF=$(node -p "require('./src-tauri/tauri.conf.json').version")
          CARGO=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          echo "package.json=$PKG tauri.conf.json=$CONF Cargo.toml=$CARGO"
          if [ "$PKG" != "$CONF" ] || [ "$PKG" != "$CARGO" ]; then
            echo "::error::Version strings differ; keep package.json, tauri.conf.json and Cargo.toml in sync"
            exit 1
          fi
          echo "MAC_VERSION=$PKG" >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile

      - name: Build SyncShot.app
        run: pnpm tauri build --target aarch64-apple-darwin --bundles app

      - name: Package ZIP
        run: |
          APP="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/SyncShot.app"
          codesign --verify --deep --strict "$APP"
          mkdir -p dist-release
          ditto -c -k --sequesterRsrc --keepParent "$APP" "dist-release/SyncShot-macOS-${MAC_VERSION}-Apple-Silicon.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: dist-release/*.zip
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4

      - name: Write release signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Android release signing secrets are missing; refusing to publish an unsigned or debug-signed APK"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/keystore.properties

      - name: Build signed APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Verify signature and name APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::Signed release APK was not produced"; exit 1; }
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK"
          VERSION=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' android/app/build.gradle.kts | head -1)
          mkdir -p dist-release
          cp "$APK" "dist-release/SyncShot-Android-${VERSION}.apk"

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" android/keystore.properties

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist-release/*.apk
          if-no-files-found: error

  publish:
    needs: [mac, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true

      - name: Write checksums
        working-directory: dist-release
        run: |
          sha256sum *.zip *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Write release notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${RELEASE_TAG}^" 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log "$PREV_TAG".."$RELEASE_TAG" --pretty=format:"- %s" --reverse)
          else
            COMMITS=$(git log "$RELEASE_TAG" --pretty=format:"- %s" --reverse)
          fi
          cat > release-notes.md <<EOF
          ## Downloads

          - **SyncShot-macOS-*-Apple-Silicon.zip** — Mac app for M-series Macs (arm64). Intel builds are not included.
          - **SyncShot-Android-*.apk** — signed Android app, Android 8.0 or newer.
          - **SHA256SUMS.txt** — SHA-256 checksums for both downloads.

          ## Install

          - Mac: unzip, move SyncShot.app into Applications, and open it. This build is ad-hoc signed and not notarized, so right-click → **Open** the first time. Grant Screen Recording permission when asked; an update may need it granted again.
          - Android: open the APK and follow Android's prompts. Updates need the same signing certificate as the installed app. If Android rejects an update, keep the existing app and its data rather than uninstalling.
          - Sign in with the same Google account on both devices.

          ## What's new

          ${COMMITS:-- No changes documented}
          EOF

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE=""
          case "$RELEASE_TAG" in preview-*) PRERELEASE="--prerelease" ;; esac
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist-release/* --clobber
          else
            gh release create "$RELEASE_TAG" dist-release/* \
              --title "SyncShot $RELEASE_TAG" \
              --notes-file release-notes.md \
              --verify-tag $PRERELEASE
          fi
