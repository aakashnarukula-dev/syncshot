<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><title>Sign in to SyncShot</title>
<style>
:root{font-family:system-ui,sans-serif;color:#f2f0e9;background:#111;color-scheme:dark}body{margin:0;min-height:100dvh;display:grid;place-items:center}main{max-width:380px;margin:24px;padding:32px;border-radius:20px;background:#1b1b1b;border:1px solid #383838;box-shadow:0 24px 60px #0005}h1{font-size:38px;font-weight:900;line-height:1.05}p{line-height:1.6;color:#b0b0b0}button{width:100%;padding:14px;border:1px solid #c8b38c;border-radius:8px;background:#f2f0e9;color:#111;font:600 15px system-ui;cursor:pointer}button:disabled{opacity:.5;cursor:wait}button:focus-visible{outline:3px solid #c8b38c;outline-offset:4px}#message{min-height:48px;font-size:14px}small{display:block;color:#a8a8a8;line-height:1.5}
</style>
</head>
<body><main>
<p>SyncShot</p><h1>Your devices. One account.</h1>
<p id="intro">Sign in with the same Google account on your Mac and Android phone.</p>
<button id="google" disabled>Continue with Google</button>
<p id="message" role="status" aria-live="polite">Preparing secure sign-in…</p>
<small>Already signed in with a phone number? Connect Google from your app’s account settings first to keep your existing library.</small>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, linkWithPopup, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";
import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-functions.js";
const app = initializeApp({apiKey:"AIzaSyApIWE3umXq6BDvxiB7fCm6NHgsZZfB4nE",authDomain:"syncshot-v2.firebaseapp.com",projectId:"syncshot-v2",storageBucket:"syncshot-v2.firebasestorage.app",messagingSenderId:"424325660516",appId:"1:424325660516:web:f839ae266e68a32ffec471"});
const auth=getAuth(app), functions=getFunctions(app,"us-central1");
const params=new URLSearchParams(location.search), port=params.get("cb_port"), state=params.get("state");
const fragment=new URLSearchParams(location.hash.slice(1)), linkToken=fragment.get("link_token");
history.replaceState(null,"",location.pathname+location.search);
const button=document.getElementById("google"), message=document.getElementById("message");
const validCallback=/^[0-9]{1,5}$/.test(port||"") && Number(port)>0 && Number(port)<=65535 && /^[a-f0-9]{32}$/.test(state||"");
let linkingUser=null;
try {
 if (!validCallback) throw Error("Open sign-in from SyncShot to start a secure session.");
 if(linkToken){linkingUser=(await signInWithCustomToken(auth,linkToken)).user;document.getElementById("intro").textContent="Connect Google to your current SyncShot account. Your library stays with you.";button.textContent="Connect Google account";}
 button.disabled=false;message.textContent="Your Google password stays with Google.";
} catch(error){message.textContent=error.message||"Could not prepare sign-in. Return to SyncShot and try again.";}
button.addEventListener("click",async()=>{
 button.disabled=true;message.textContent="Choose your Google account in the browser window.";
 try{
  const provider=new GoogleAuthProvider();provider.setCustomParameters({prompt:"select_account"});
  if(linkingUser) await linkWithPopup(linkingUser,provider); else await signInWithPopup(auth,provider);
  const {data}=await httpsCallable(functions,"mintDesktopToken")();
  if(!data?.token) throw Error("Sign-in finished but the app could not receive a session. Try again.");
  message.textContent="Signed in. Returning to SyncShot…";
  location.replace(`http://127.0.0.1:${port}/?token=${encodeURIComponent(data.token)}&state=${encodeURIComponent(state)}`);
 }catch(error){
  const messages={"auth/popup-closed-by-user":"Sign-in cancelled. Try again when you’re ready.","auth/popup-blocked":"Allow pop-ups for this page, then try again.","auth/credential-already-in-use":"This Google account already has a SyncShot library. Choose a different Google account or contact support before migrating.","auth/operation-not-allowed":"Google sign-in is not enabled yet. Contact SyncShot support."};
  message.textContent=messages[error.code]||"Could not finish sign-in. Check your connection and try again.";button.disabled=false;
 }
});
</script></body></html>
