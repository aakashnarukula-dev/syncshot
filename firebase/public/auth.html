<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in · SyncShot</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #000000;
        --panel: #070707;
        --line: #181818;
        --line-2: #242424;
        --fg: #e6e6e6;
        --dim: #6b6b6b;
        --accent: #3ddc97;
        --accent-dim: #1f6f53;
        --err: #ff6b6b;
        --field: #0b0b0b;
        --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code",
          Menlo, Consolas, "Liberation Mono", monospace;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0; background: var(--bg); color: var(--fg);
        font: 13px/1.55 var(--mono);
        -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
        display: grid; place-items: center; padding: 22px;
        background-image:
          radial-gradient(130% 70% at 50% -15%, rgba(61, 220, 151, 0.07), transparent 62%);
        background-repeat: no-repeat;
      }
      .panel {
        width: min(100%, 358px);
        border: 1px solid var(--line); border-radius: 13px;
        background: linear-gradient(180deg, var(--panel), #020202);
        box-shadow: 0 0 0 1px #000, 0 30px 70px -34px rgba(0, 0, 0, 0.95);
        overflow: hidden;
      }
      .bar {
        display: flex; align-items: center; gap: 7px;
        padding: 10px 14px; border-bottom: 1px solid var(--line);
        color: var(--dim); font-size: 11px; letter-spacing: 0.03em;
      }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: #1c1c1c; }
      .dot.live { background: var(--accent); box-shadow: 0 0 9px var(--accent); }
      .bar .path { margin-left: 5px; }
      .body { padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 16px; }
      h1 {
        margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -0.01em;
        display: flex; align-items: center; gap: 9px;
      }
      h1 .caret {
        width: 8px; height: 15px; background: var(--accent); border-radius: 1px;
        display: inline-block; animation: blink 1.1s steps(1) infinite;
      }
      @keyframes blink { 50% { opacity: 0; } }
      p.sub { margin: 0; color: var(--dim); font-size: 12.5px; }
      label {
        display: block; font-size: 11px; letter-spacing: 0.13em;
        text-transform: uppercase; color: var(--dim); margin-bottom: 8px;
      }
      form { margin: 0; }
      .row { display: flex; gap: 8px; align-items: stretch; }
      .prefix {
        display: grid; place-items: center; padding: 0 12px;
        border: 1px solid var(--line-2); border-radius: 9px; background: var(--field);
        color: var(--dim); font-variant-numeric: tabular-nums;
      }
      input {
        flex: 1; width: 100%; padding: 11px 13px; font: inherit; color: var(--fg);
        border: 1px solid var(--line-2); border-radius: 9px; background: var(--field);
        outline: none; transition: border-color 0.15s, box-shadow 0.15s;
      }
      input::placeholder { color: #353535; }
      input:focus {
        border-color: var(--accent-dim);
        box-shadow: 0 0 0 3px rgba(61, 220, 151, 0.13);
      }
      input#code {
        letter-spacing: 0.42em; text-align: center; font-size: 18px;
        font-variant-numeric: tabular-nums;
      }
      input:disabled { opacity: 0.5; }
      button {
        padding: 11px 16px; font: inherit; font-weight: 600; cursor: pointer;
        border: 0; border-radius: 9px; background: var(--accent); color: #04140d;
        white-space: nowrap; transition: filter 0.15s, transform 0.02s;
      }
      button:hover:not(:disabled) { filter: brightness(1.08); }
      button:active:not(:disabled) { transform: translateY(0.5px); }
      button:disabled { opacity: 0.45; cursor: default; }
      .msg { font-size: 12px; min-height: 1.2em; color: var(--dim); }
      .msg::before { content: "› "; color: var(--accent-dim); }
      .msg:empty::before { content: ""; }
      .msg.err { color: var(--err); }
      .msg.err::before { content: "✗ "; color: var(--err); }
      .msg.ok { color: var(--accent); }
      .msg.ok::before { content: "✓ "; color: var(--accent); }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <main class="panel">
      <div class="bar">
        <span class="dot live"></span><span class="dot"></span><span class="dot"></span>
        <span class="path">syncshot — secure sign-in</span>
      </div>
      <div class="body">
        <div>
          <h1>Sign in<span class="caret"></span></h1>
          <p class="sub">We'll text a 6-digit code to your phone.</p>
        </div>

        <form id="phoneForm" novalidate>
          <label for="phone">Mobile number</label>
          <div class="row">
            <span class="prefix">+91</span>
            <input id="phone" type="tel" inputmode="numeric" autocomplete="tel-national"
                   placeholder="98765 43210" maxlength="10" />
            <button id="send" type="submit">Send code</button>
          </div>
        </form>

        <form id="codeForm" class="hidden" novalidate>
          <label for="code">Verification code</label>
          <div class="row">
            <input id="code" type="text" inputmode="numeric" autocomplete="one-time-code"
                   placeholder="••••••" maxlength="6" aria-label="6-digit verification code" />
          </div>
        </form>

        <p id="msg" class="msg" role="status" aria-live="polite"></p>
        <div id="recaptcha"></div>
      </div>
    </main>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
      import {
        getAuth, RecaptchaVerifier, signInWithPhoneNumber,
      } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";
      import {
        getFunctions, httpsCallable,
      } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-functions.js";

      // Public web-app config for syncshot-v2 (mirrors src/lib/sync/firebaseConfig.ts).
      const app = initializeApp({
        apiKey: "AIzaSyApIWE3umXq6BDvxiB7fCm6NHgsZZfB4nE",
        authDomain: "syncshot-v2.firebaseapp.com",
        projectId: "syncshot-v2",
        storageBucket: "syncshot-v2.firebasestorage.app",
        messagingSenderId: "424325660516",
        appId: "1:424325660516:web:f839ae266e68a32ffec471",
      });
      const auth = getAuth(app);
      auth.useDeviceLanguage();
      const functions = getFunctions(app, "us-central1");

      const params = new URLSearchParams(location.search);
      const cbPort = params.get("cb_port");
      const state = params.get("state");

      const $ = (id) => document.getElementById(id);
      const msg = $("msg");
      const setMsg = (text, kind = "") => {
        msg.textContent = text;
        msg.className = "msg" + (kind ? " " + kind : "");
      };
      const digits = (s) => (s || "").replace(/\D/g, "");

      if (!cbPort || !state) {
        $("phoneForm").classList.add("hidden");
        setMsg("Open sign-in from the SyncShot app.", "err");
        throw new Error("missing callback params");
      }

      let confirmation = null;
      let verifier = null;
      let verifying = false;

      $("phone").addEventListener("input", (e) => {
        e.target.value = digits(e.target.value).slice(0, 10);
      });
      $("code").addEventListener("input", (e) => {
        const v = digits(e.target.value).slice(0, 6);
        e.target.value = v;
        // Auto-verify the moment 6 digits are present (matches desktop SignInView).
        if (v.length === 6) verifyCode();
      });

      async function sendCode() {
        const phone = digits($("phone").value);
        if (phone.length !== 10) {
          setMsg("Enter your 10-digit mobile number.", "err");
          return;
        }
        $("send").disabled = true;
        setMsg("Sending code…");
        try {
          verifier?.clear();
          verifier = new RecaptchaVerifier(auth, "recaptcha", { size: "invisible" });
          confirmation = await signInWithPhoneNumber(auth, "+91" + phone, verifier);
          $("codeForm").classList.remove("hidden");
          $("send").textContent = "Resend";
          setMsg("Code sent. Enter it below.", "ok");
          $("code").value = "";
          $("code").disabled = false;
          $("code").focus();
        } catch (err) {
          setMsg(err?.message || String(err), "err");
        } finally {
          $("send").disabled = false;
        }
      }

      async function verifyCode() {
        if (verifying) return;
        const code = digits($("code").value);
        if (code.length !== 6 || !confirmation) {
          setMsg("Enter the 6-digit code.", "err");
          return;
        }
        verifying = true;
        $("code").disabled = true;
        setMsg("Verifying…");
        try {
          await confirmation.confirm(code);
          // OTP is good; now mint the desktop hand-off token. Only after we hold a
          // real token do we redirect to the loopback listener.
          setMsg("Verified. Finishing sign-in…", "ok");
          const { data } = await httpsCallable(functions, "mintDesktopToken")();
          if (!data || !data.token) {
            throw new Error("Sign-in succeeded but no token was returned.");
          }
          setMsg("Signed in. Returning to SyncShot…", "ok");
          const url =
            "http://127.0.0.1:" + cbPort + "/?token=" +
            encodeURIComponent(data.token) + "&state=" + encodeURIComponent(state);
          location.href = url;
        } catch (err) {
          setMsg(err?.message || String(err), "err");
          verifying = false;
          $("code").disabled = false;
          $("code").focus();
        }
      }

      $("phoneForm").addEventListener("submit", (e) => {
        e.preventDefault();
        sendCode();
      });
      $("codeForm").addEventListener("submit", (e) => {
        e.preventDefault();
        verifyCode();
      });
    </script>
  </body>
</html>
